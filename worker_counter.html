<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0f0f10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>작업량 입력</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #0f0f10;
      --surface: rgba(255,255,255,0.03);
      --border: rgba(255,255,255,0.08);
      --text: #f5f0e6;
      --text-dim: #8a857a;
      --text-muted: #5a564f;
      --amber: #ffd60a;
      --amber-dim: rgba(255,214,10,0.15);
      --emerald: #00d97e;
      --red: #ff3d6e;
    }
    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans KR', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    body {
      background-image:
        linear-gradient(rgba(255,214,10,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,214,10,0.04) 1px, transparent 1px);
      background-size: 32px 32px;
    }
    button { background: none; border: none; color: inherit; font: inherit; cursor: pointer; }
    input { background: none; border: none; color: inherit; font: inherit; outline: none; }
    .display { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.01em; }
    .mono { font-family: 'JetBrains Mono', monospace; }

    .app { max-width: 480px; margin: 0 auto; padding-bottom: 32px; min-height: 100vh; position: relative; }
    .screen { display: none; }
    .screen.active { display: block; }

    /* SETUP SCREEN */
    .setup { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
    .setup-icon { width: 80px; height: 80px; border-radius: 20px; background: linear-gradient(135deg, rgba(255,214,10,0.2), rgba(255,170,0,0.1)); border: 1px solid rgba(255,214,10,0.3); display: flex; align-items: center; justify-content: center; margin-bottom: 24px; }
    .setup-tag { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.3em; color: rgba(255,214,10,0.7); }
    .setup-title { font-size: 28px; font-weight: 900; margin-top: 8px; margin-bottom: 4px; letter-spacing: -0.02em; }
    .setup-sub { font-size: 14px; color: var(--text-dim); margin-bottom: 32px; text-align: center; }
    .input-field { width: 100%; padding: 16px 20px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 12px; font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 16px; }
    .input-field:focus { border-color: rgba(255,214,10,0.6); }
    .input-field::placeholder { color: var(--text-muted); font-weight: 400; }
    .btn-primary { width: 100%; padding: 16px; border-radius: 12px; font-size: 17px; font-weight: 700; background: var(--amber); color: #0f0f10; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-primary:disabled { opacity: 0.3; background: rgba(255,255,255,0.05); color: var(--text-muted); }
    .btn-primary:active:not(:disabled) { transform: scale(0.98); }

    /* HEADER */
    .header { padding: 24px 20px 16px; display: flex; justify-content: space-between; align-items: flex-start; }
    .header-tag { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.25em; color: rgba(255,214,10,0.7); }
    .header-name { font-size: 22px; font-weight: 700; margin-top: 2px; }
    .header-id { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-muted); margin-top: 2px; }
    .icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; }
    .icon-btn:active { background: var(--surface); }

    /* TAB SWITCHER */
    .tabs { margin: 0 20px 20px; padding: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; display: flex; }
    .tab { flex: 1; padding: 10px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--text-dim); display: flex; align-items: center; justify-content: center; gap: 6px; }
    .tab.active { background: var(--amber); color: #0f0f10; }

    /* SECTION LABEL */
    .label { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.2em; color: var(--text-muted); margin-bottom: 8px; }

    /* SCAN AREA */
    .scan-section { padding: 0 20px; margin-bottom: 20px; }
    .scan-area { position: relative; aspect-ratio: 4/3; border-radius: 16px; overflow: hidden; border: 2px solid rgba(255,255,255,0.08); background: #0a0a0b; }
    .scan-placeholder { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
    .scan-placeholder:active { background: rgba(255,255,255,0.02); }
    .scan-icon-wrap { width: 64px; height: 64px; border-radius: 16px; border: 1px solid rgba(255,214,10,0.3); background: rgba(255,214,10,0.05); display: flex; align-items: center; justify-content: center; animation: pulse-amber 1.6s infinite; }
    @keyframes pulse-amber { 0%,100% { box-shadow: 0 0 0 0 rgba(255,214,10,0.4); } 50% { box-shadow: 0 0 0 12px rgba(255,214,10,0); } }
    .scan-text { font-weight: 600; }
    .scan-formats { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.15em; color: var(--text-muted); }

    .scan-video { width: 100%; height: 100%; object-fit: cover; }
    .scan-overlay { position: absolute; inset: 0; pointer-events: none; }
    .scan-frame { position: absolute; left: 32px; right: 32px; top: 25%; bottom: 25%; border: 2px solid var(--amber); border-radius: 8px; }
    .scan-line-anim { position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: var(--amber); box-shadow: 0 0 12px var(--amber); animation: scanline 2s ease-in-out infinite; }
    @keyframes scanline { 0%, 100% { transform: translateY(-50%); opacity: 0.8; } 50% { transform: translateY(50%); opacity: 1; } }
    .scan-close { position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; border-radius: 50%; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; }
    .scan-status { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); padding: 6px 12px; border-radius: 999px; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.2em; color: var(--amber); }

    .error-msg { margin-top: 8px; padding: 10px 12px; background: rgba(255,61,110,0.1); border: 1px solid rgba(255,61,110,0.3); border-radius: 8px; display: flex; gap: 8px; font-size: 12px; color: #ff8caa; }
    .error-msg svg { flex-shrink: 0; margin-top: 2px; }

    /* PART INPUT */
    .part-section { padding: 0 20px; margin-bottom: 20px; }
    .part-input-wrap { position: relative; }
    .part-input { width: 100%; padding: 16px 20px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 12px; font-size: 18px; font-weight: 600; }
    .part-input:focus { border-color: rgba(255,214,10,0.6); }
    .part-input::placeholder { color: var(--text-muted); font-weight: 400; }
    .part-clear { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; }

    /* QTY STEPPER */
    .qty-section { padding: 0 20px; margin-bottom: 24px; }
    .qty-stepper { padding: 16px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 16px; display: flex; align-items: center; justify-content: space-between; }
    .qty-btn { width: 64px; height: 64px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
    .qty-btn-minus { background: rgba(255,255,255,0.08); }
    .qty-btn-plus { background: var(--amber); }
    .qty-btn:active { transform: scale(0.95); }
    .qty-btn:disabled { opacity: 0.3; }
    .qty-display { display: flex; flex-direction: column; align-items: center; }
    .qty-num { font-family: 'Bebas Neue', sans-serif; font-size: 72px; line-height: 1; color: var(--amber); font-variant-numeric: tabular-nums; }
    .qty-unit { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.2em; color: var(--text-muted); margin-top: 4px; }
    .qty-quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
    .qty-quick-btn { padding: 10px; border-radius: 8px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--text-dim); }
    .qty-quick-btn:active { background: var(--surface); }

    /* SUBMIT */
    .submit-section { padding: 0 20px; }
    .submit-btn { width: 100%; padding: 20px; border-radius: 16px; font-size: 20px; font-weight: 700; background: linear-gradient(135deg, var(--amber), #ffaa00); color: #0f0f10; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 8px 24px rgba(255,214,10,0.25); }
    .submit-btn:disabled { opacity: 0.3; background: rgba(255,255,255,0.05); color: var(--text-muted); box-shadow: none; }
    .submit-btn:active:not(:disabled) { transform: scale(0.98); }

    /* HISTORY */
    .history { padding: 0 20px; }
    .stat-card { padding: 20px; border-radius: 16px; background: linear-gradient(135deg, rgba(255,214,10,0.1), transparent); border: 1px solid rgba(255,214,10,0.3); margin-bottom: 20px; }
    .stat-tag { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.2em; color: rgba(255,214,10,0.8); }
    .stat-sub { font-size: 14px; color: var(--text-dim); margin-top: 2px; }
    .stat-num-wrap { display: flex; align-items: baseline; gap: 8px; margin-top: 12px; }
    .stat-num { font-family: 'Bebas Neue', sans-serif; font-size: 72px; line-height: 1; color: var(--amber); font-variant-numeric: tabular-nums; }
    .stat-unit { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--text-muted); }
    .stat-meta { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-muted); margin-top: 8px; }

    .part-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
    .part-item { padding: 12px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 12px; }
    .part-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .part-item-name { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; }
    .part-item-qty { font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: var(--amber); font-variant-numeric: tabular-nums; }
    .part-item-bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,0.05); overflow: hidden; }
    .part-item-fill { height: 100%; border-radius: 2px; background: var(--amber); transition: width 0.4s; }

    .recent-list { display: flex; flex-direction: column; gap: 6px; }
    .recent-item { padding: 12px; background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
    .recent-info { min-width: 0; flex: 1; }
    .recent-part { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; }
    .recent-time { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .recent-qty { font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: var(--amber); font-variant-numeric: tabular-nums; flex-shrink: 0; margin-left: 12px; }
    .recent-delete { margin-left: 8px; width: 28px; height: 28px; border-radius: 50%; background: rgba(255,61,110,0.1); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .recent-delete:active { background: rgba(255,61,110,0.25); }

    .empty { text-align: center; padding: 48px 24px; color: var(--text-muted); font-size: 14px; }

    /* EXPORT BUTTONS */
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
    .action-btn { padding: 14px; border-radius: 12px; border: 1px solid var(--border); background: rgba(255,255,255,0.03); font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .action-btn:active { background: var(--surface); }
    .action-btn.danger { border-color: rgba(255,61,110,0.3); color: #ff8caa; }

    /* SUCCESS TOAST */
    .toast { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; pointer-events: none; }
    .toast.hidden { display: none; }
    .toast-card { background: var(--emerald); border-radius: 24px; padding: 24px 32px; display: flex; flex-direction: column; align-items: center; gap: 8px; box-shadow: 0 20px 60px rgba(0,217,126,0.4); animation: pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes pop { 0% { transform: scale(0.5); opacity: 0; } 50% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
    .toast-icon { width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; }
    .toast-text { color: white; font-weight: 700; font-size: 17px; }

    /* MODAL */
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 90; display: none; align-items: flex-end; }
    .modal-bg.active { display: flex; }
    .modal { width: 100%; max-width: 480px; margin: 0 auto; background: #18181a; border-radius: 24px 24px 0 0; padding: 24px 20px 32px; }
    .modal-handle { width: 36px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.2); margin: 0 auto 16px; }
    .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .modal-sub { font-size: 13px; color: var(--text-dim); margin-bottom: 20px; }
    .modal-btns { display: flex; flex-direction: column; gap: 8px; }

    .footer { text-align: center; padding: 24px; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-muted); letter-spacing: 0.15em; }
  </style>
</head>
<body>
  <div class="app">
    <!-- SETUP SCREEN -->
    <div class="screen" id="screen-setup">
      <div class="setup">
        <div class="setup-icon">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#ffd60a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <div class="setup-tag">WORKER REGISTRATION</div>
        <h1 class="setup-title">작업자 등록</h1>
        <p class="setup-sub">이름을 입력하면 작업자 ID가 자동 발급됩니다</p>
        <input type="text" id="setup-name" class="input-field" placeholder="이름 (예: 김철수)" autocomplete="off">
        <button id="setup-save" class="btn-primary" disabled>
          시작하기
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
    </div>

    <!-- MAIN -->
    <div class="screen" id="screen-main">
      <header class="header">
        <div>
          <div class="header-tag">OPERATOR</div>
          <div class="header-name" id="worker-name">-</div>
          <div class="header-id" id="worker-id">-</div>
        </div>
        <button class="icon-btn" id="btn-settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </header>

      <div class="tabs">
        <button class="tab active" data-tab="input">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 9.4 7.55 4.24"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
          작업 입력
        </button>
        <button class="tab" data-tab="history">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
          작업 내역
        </button>
      </div>

      <!-- INPUT TAB -->
      <div id="tab-input">
        <div class="scan-section">
          <div class="label">STEP 1 · 품번 스캔</div>
          <div class="scan-area" id="scan-area">
            <button class="scan-placeholder" id="btn-start-scan">
              <div class="scan-icon-wrap">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ffd60a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg>
              </div>
              <div class="scan-text">탭하여 바코드 스캔</div>
              <div class="scan-formats">QR · CODE 128 · EAN · UPC</div>
            </button>
          </div>
          <div id="scan-error" style="display:none;"></div>
        </div>

        <div class="part-section">
          <div class="label">품번</div>
          <div class="part-input-wrap">
            <input type="text" id="part-number" class="part-input" placeholder="품번 입력 또는 스캔" autocomplete="off">
            <button class="part-clear" id="part-clear" style="display:none;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
        </div>

        <div class="qty-section">
          <div class="label">STEP 2 · 수량</div>
          <div class="qty-stepper">
            <button class="qty-btn qty-btn-minus" id="qty-minus">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#f5f0e6" stroke-width="2.5" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
            <div class="qty-display">
              <div class="qty-num" id="qty-num">1</div>
              <div class="qty-unit">EA</div>
            </div>
            <button class="qty-btn qty-btn-plus" id="qty-plus">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0f0f10" stroke-width="3" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
          </div>
          <div class="qty-quick">
            <button class="qty-quick-btn" data-qty="5">+5</button>
            <button class="qty-quick-btn" data-qty="10">+10</button>
            <button class="qty-quick-btn" data-qty="20">+20</button>
            <button class="qty-quick-btn" data-qty="50">+50</button>
          </div>
        </div>

        <div class="submit-section">
          <button class="submit-btn" id="btn-submit" disabled>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            제출하기
          </button>
        </div>
      </div>

      <!-- HISTORY TAB -->
      <div id="tab-history" class="history" style="display:none;">
        <div class="stat-card">
          <div class="stat-tag">TOTAL TODAY</div>
          <div class="stat-sub" id="history-name">- · 오늘 작업량</div>
          <div class="stat-num-wrap">
            <span class="stat-num" id="stat-total">0</span>
            <span class="stat-unit">EA</span>
          </div>
          <div class="stat-meta" id="stat-meta">0 건 제출</div>
        </div>

        <div id="parts-section">
          <div class="label">BY PART NUMBER</div>
          <div class="part-list" id="part-list"></div>
        </div>

        <div>
          <div class="label">RECENT</div>
          <div id="recent-container"></div>
        </div>

        <div class="actions">
          <button class="action-btn" id="btn-export">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            CSV 내보내기
          </button>
          <button class="action-btn danger" id="btn-clear">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            전체 삭제
          </button>
        </div>
      </div>

      <div class="footer">WORKER COUNTER · v1.0</div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast hidden" id="toast">
    <div class="toast-card">
      <div class="toast-icon">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div class="toast-text">제출 완료</div>
    </div>
  </div>

  <!-- SETTINGS MODAL -->
  <div class="modal-bg" id="modal-settings">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-title">설정</div>
      <div class="modal-sub">작업자 정보 변경 또는 데이터 관리</div>
      <div class="modal-btns">
        <button class="btn-primary" id="btn-change-worker" style="background:rgba(255,255,255,0.06);color:var(--text);">작업자 변경</button>
        <button class="btn-primary" id="btn-modal-close" style="background:transparent;color:var(--text-dim);">닫기</button>
      </div>
    </div>
  </div>

  <script>
    // ============ STORAGE ============
    const memStore = {};
    const storage = {
      get(key, defaultVal) {
        try {
          const v = localStorage.getItem(key);
          return v ? JSON.parse(v) : (defaultVal ?? null);
        } catch {
          return memStore[key] ?? defaultVal ?? null;
        }
      },
      set(key, value) {
        try { localStorage.setItem(key, JSON.stringify(value)); }
        catch { memStore[key] = value; }
      },
      remove(key) {
        try { localStorage.removeItem(key); } catch { delete memStore[key]; }
      }
    };

    // ============ STATE ============
    const state = {
      worker: null,
      tab: 'input',
      partNumber: '',
      quantity: 1,
      submissions: [],
      scanning: false,
      stream: null,
      detector: null,
      rafId: null,
    };

    // ============ INIT ============
    function init() {
      state.worker = storage.get('worker:me');
      state.submissions = storage.get('submissions', []);

      if (!state.worker) {
        showScreen('setup');
      } else {
        showScreen('main');
        renderHeader();
        renderInput();
      }
      bindEvents();
    }

    function showScreen(name) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('screen-' + name).classList.add('active');
    }

    // ============ SETUP ============
    function bindSetup() {
      const input = document.getElementById('setup-name');
      const btn = document.getElementById('setup-save');
      input.addEventListener('input', e => {
        btn.disabled = !e.target.value.trim();
      });
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter' && input.value.trim()) saveWorker();
      });
      btn.addEventListener('click', saveWorker);
    }

    function saveWorker() {
      const name = document.getElementById('setup-name').value.trim();
      if (!name) return;
      const worker = {
        name,
        id: 'W-' + Date.now().toString(36).toUpperCase().slice(-5)
      };
      storage.set('worker:me', worker);
      state.worker = worker;
      document.getElementById('setup-name').value = '';
      document.getElementById('setup-save').disabled = true;
      showScreen('main');
      renderHeader();
      renderInput();
    }

    // ============ HEADER ============
    function renderHeader() {
      document.getElementById('worker-name').textContent = state.worker.name;
      document.getElementById('worker-id').textContent = state.worker.id;
      document.getElementById('history-name').textContent = state.worker.name + ' · 오늘 작업량';
    }

    // ============ TABS ============
    function switchTab(tab) {
      state.tab = tab;
      document.querySelectorAll('.tab').forEach(t => {
        t.classList.toggle('active', t.dataset.tab === tab);
      });
      document.getElementById('tab-input').style.display = tab === 'input' ? 'block' : 'none';
      document.getElementById('tab-history').style.display = tab === 'history' ? 'block' : 'none';
      if (tab === 'history') renderHistory();
      if (tab !== 'input' && state.scanning) stopScan();
    }

    // ============ INPUT TAB ============
    function renderInput() {
      const partInput = document.getElementById('part-number');
      partInput.value = state.partNumber;
      document.getElementById('part-clear').style.display = state.partNumber ? 'flex' : 'none';
      document.getElementById('qty-num').textContent = state.quantity;
      document.getElementById('qty-minus').disabled = state.quantity <= 1;
      document.getElementById('btn-submit').disabled = !state.partNumber.trim();
    }

    function setQuantity(n) {
      state.quantity = Math.max(1, n);
      renderInput();
    }

    function setPartNumber(val) {
      state.partNumber = val;
      renderInput();
    }

    // ============ BARCODE SCAN ============
    async function startScan() {
      const errEl = document.getElementById('scan-error');
      errEl.style.display = 'none';

      if (!('BarcodeDetector' in window)) {
        showError('이 브라우저는 자동 스캔을 지원하지 않아요. 품번을 직접 입력해주세요. (안드로이드 Chrome 권장)');
        return;
      }

      try {
        state.stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' }
        });
      } catch (e) {
        showError('카메라 접근 실패: ' + e.message + ' · 브라우저 설정에서 카메라 권한을 허용해주세요.');
        return;
      }

      state.scanning = true;
      const area = document.getElementById('scan-area');
      area.innerHTML = `
        <video id="scan-video" class="scan-video" playsinline muted></video>
        <div class="scan-overlay">
          <div class="scan-frame"><div class="scan-line-anim"></div></div>
        </div>
        <button class="scan-close" id="scan-close-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <div class="scan-status">SCANNING...</div>
      `;
      document.getElementById('scan-close-btn').addEventListener('click', stopScan);

      const video = document.getElementById('scan-video');
      video.srcObject = state.stream;
      await video.play().catch(() => {});

      state.detector = new window.BarcodeDetector({
        formats: ['code_128', 'ean_13', 'ean_8', 'qr_code', 'code_39', 'upc_a', 'upc_e', 'codabar', 'itf']
      });

      const tick = async () => {
        if (!state.scanning || !video) return;
        try {
          const codes = await state.detector.detect(video);
          if (codes && codes.length > 0) {
            const code = codes[0].rawValue;
            if (navigator.vibrate) navigator.vibrate(80);
            setPartNumber(code);
            stopScan();
            return;
          }
        } catch {}
        state.rafId = requestAnimationFrame(tick);
      };
      tick();
    }

    function stopScan() {
      state.scanning = false;
      if (state.rafId) { cancelAnimationFrame(state.rafId); state.rafId = null; }
      if (state.stream) {
        state.stream.getTracks().forEach(t => t.stop());
        state.stream = null;
      }
      const area = document.getElementById('scan-area');
      area.innerHTML = `
        <button class="scan-placeholder" id="btn-start-scan">
          <div class="scan-icon-wrap">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ffd60a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg>
          </div>
          <div class="scan-text">탭하여 바코드 스캔</div>
          <div class="scan-formats">QR · CODE 128 · EAN · UPC</div>
        </button>
      `;
      document.getElementById('btn-start-scan').addEventListener('click', startScan);
    }

    function showError(msg) {
      const errEl = document.getElementById('scan-error');
      errEl.className = 'error-msg';
      errEl.style.display = 'flex';
      errEl.innerHTML = `
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ff8caa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span>${msg}</span>
      `;
    }

    // ============ SUBMIT ============
    function submit() {
      if (!state.partNumber.trim() || state.quantity < 1) return;
      const entry = {
        worker: state.worker.name,
        workerId: state.worker.id,
        partNumber: state.partNumber.trim(),
        quantity: state.quantity,
        timestamp: Date.now()
      };
      state.submissions = [entry, ...state.submissions].slice(0, 1000);
      storage.set('submissions', state.submissions);

      if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
      showToast();
      state.partNumber = '';
      state.quantity = 1;
      renderInput();
    }

    function showToast() {
      const toast = document.getElementById('toast');
      toast.classList.remove('hidden');
      // restart animation
      const card = toast.querySelector('.toast-card');
      card.style.animation = 'none';
      void card.offsetWidth;
      card.style.animation = '';
      setTimeout(() => toast.classList.add('hidden'), 1400);
    }

    // ============ HISTORY ============
    function renderHistory() {
      const today = new Date(); today.setHours(0,0,0,0);
      const myToday = state.submissions.filter(s => s.workerId === state.worker.id && s.timestamp >= today.getTime());
      const myTotal = myToday.reduce((s, e) => s + e.quantity, 0);

      document.getElementById('stat-total').textContent = myTotal.toLocaleString();
      document.getElementById('stat-meta').textContent = `${myToday.length} 건 제출 · 오늘 ${new Date().toLocaleDateString('ko-KR')}`;

      // By part
      const byPart = {};
      myToday.forEach(s => { byPart[s.partNumber] = (byPart[s.partNumber] || 0) + s.quantity; });
      const sorted = Object.entries(byPart).sort((a,b) => b[1] - a[1]);

      const partListEl = document.getElementById('part-list');
      const partsSection = document.getElementById('parts-section');
      if (sorted.length === 0) {
        partsSection.style.display = 'none';
      } else {
        partsSection.style.display = 'block';
        partListEl.innerHTML = sorted.map(([part, qty]) => {
          const pct = (qty / myTotal) * 100;
          return `
            <div class="part-item">
              <div class="part-item-header">
                <span class="part-item-name">${escapeHtml(part)}</span>
                <span class="part-item-qty">${qty}</span>
              </div>
              <div class="part-item-bar"><div class="part-item-fill" style="width:${pct}%"></div></div>
            </div>
          `;
        }).join('');
      }

      // Recent
      const recentEl = document.getElementById('recent-container');
      const mine = state.submissions.filter(s => s.workerId === state.worker.id).slice(0, 30);
      if (mine.length === 0) {
        recentEl.innerHTML = '<div class="empty">아직 제출된 내역이 없습니다</div>';
      } else {
        recentEl.innerHTML = '<div class="recent-list">' + mine.map(s => `
          <div class="recent-item">
            <div class="recent-info">
              <div class="recent-part">${escapeHtml(s.partNumber)}</div>
              <div class="recent-time">${new Date(s.timestamp).toLocaleString('ko-KR', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' })}</div>
            </div>
            <span class="recent-qty">+${s.quantity}</span>
            <button class="recent-delete" data-ts="${s.timestamp}">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ff8caa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
        `).join('') + '</div>';

        recentEl.querySelectorAll('.recent-delete').forEach(btn => {
          btn.addEventListener('click', () => {
            const ts = parseInt(btn.dataset.ts);
            if (confirm('이 항목을 삭제하시겠습니까?')) {
              state.submissions = state.submissions.filter(s => s.timestamp !== ts);
              storage.set('submissions', state.submissions);
              renderHistory();
            }
          });
        });
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    // ============ EXPORT CSV ============
    function exportCSV() {
      const mine = state.submissions.filter(s => s.workerId === state.worker.id);
      if (mine.length === 0) { alert('내보낼 데이터가 없습니다'); return; }
      const header = '\uFEFF작업자,작업자ID,품번,수량,일시\n';
      const rows = mine.map(s => {
        const date = new Date(s.timestamp).toLocaleString('ko-KR');
        return `"${s.worker}","${s.workerId}","${s.partNumber}",${s.quantity},"${date}"`;
      }).join('\n');
      const blob = new Blob([header + rows], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const today = new Date().toISOString().slice(0,10);
      a.href = url;
      a.download = `작업량_${state.worker.name}_${today}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function clearAll() {
      if (!confirm('모든 작업 내역을 삭제합니다.\n이 작업은 되돌릴 수 없습니다.')) return;
      state.submissions = [];
      storage.set('submissions', []);
      renderHistory();
    }

    function changeWorker() {
      if (!confirm('작업자를 변경하시겠습니까?\n저장된 작업 내역은 유지됩니다.')) return;
      storage.remove('worker:me');
      state.worker = null;
      closeModal();
      showScreen('setup');
    }

    function openModal() { document.getElementById('modal-settings').classList.add('active'); }
    function closeModal() { document.getElementById('modal-settings').classList.remove('active'); }

    // ============ EVENT BINDING ============
    function bindEvents() {
      bindSetup();

      // Tab switching
      document.querySelectorAll('.tab').forEach(t => {
        t.addEventListener('click', () => switchTab(t.dataset.tab));
      });

      // Scan
      document.getElementById('btn-start-scan').addEventListener('click', startScan);

      // Part input
      const partInput = document.getElementById('part-number');
      partInput.addEventListener('input', e => setPartNumber(e.target.value));
      document.getElementById('part-clear').addEventListener('click', () => {
        setPartNumber('');
        partInput.focus();
      });

      // Qty
      document.getElementById('qty-minus').addEventListener('click', () => setQuantity(state.quantity - 1));
      document.getElementById('qty-plus').addEventListener('click', () => setQuantity(state.quantity + 1));
      document.querySelectorAll('.qty-quick-btn').forEach(b => {
        b.addEventListener('click', () => setQuantity(parseInt(b.dataset.qty)));
      });

      // Submit
      document.getElementById('btn-submit').addEventListener('click', submit);

      // History actions
      document.getElementById('btn-export').addEventListener('click', exportCSV);
      document.getElementById('btn-clear').addEventListener('click', clearAll);

      // Settings
      document.getElementById('btn-settings').addEventListener('click', openModal);
      document.getElementById('btn-modal-close').addEventListener('click', closeModal);
      document.getElementById('btn-change-worker').addEventListener('click', changeWorker);
      document.getElementById('modal-settings').addEventListener('click', e => {
        if (e.target.id === 'modal-settings') closeModal();
      });
    }

    init();
  </script>
</body>
</html>
